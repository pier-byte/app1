<!-- BEGIN: Interactive Behavior Script -->
<script data-purpose="modal-and-state-interactivity">
    document.addEventListener('DOMContentLoaded', () => {
      const modalOverlay = document.getElementById('categoryModalOverlay');
      const openModalBtn = document.getElementById('openCategorySheetBtn');
      const closeModalBtn = document.getElementById('cancelModalBtn');
      const confirmModalBtn = document.getElementById('confirmModalBtn');
      const selectedDot = document.getElementById('selectedCategoryDot');
      const selectedName = document.getElementById('selectedCategoryName');

      // Function to show modal
      const showModal = () => {
        modalOverlay.classList.remove('hidden');
        modalOverlay.classList.add('flex');
      };

      // Function to hide modal
      const hideModal = () => {
        modalOverlay.classList.add('hidden');
        modalOverlay.classList.remove('flex');
      };

      // Open Modal event
      openModalBtn.addEventListener('click', showModal);

      // Dismiss on Cancel
      closeModalBtn.addEventListener('click', hideModal);

      // Confirm & Update Selection
      confirmModalBtn.addEventListener('click', () => {
        const checkedRadio = document.querySelector('input[name="event_category"]:checked');
        if (checkedRadio) {
          const catName = checkedRadio.value;
          const catColor = checkedRadio.getAttribute('data-color') || '#30D158';

          selectedName.textContent = catName;
          selectedDot.style.backgroundColor = catColor;
        }
        hideModal();
      });

      // Dismiss by clicking outside sheet
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
          hideModal();
        }
      });
    });
  </script>
<!-- END: Interactive Behavior Script -->
