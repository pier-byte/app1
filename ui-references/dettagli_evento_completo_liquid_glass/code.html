<!DOCTYPE html><html class="dark" lang="it"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Nuovo Evento - Liquid Glass</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0066cc',
              blueHover: '#0052a3',
              pink: '#e02477',
            },
            glass: {
              base: 'rgba(28, 28, 30, 0.65)',
              elevated: 'rgba(44, 44, 46, 0.55)',
              card: 'rgba(38, 38, 42, 0.45)',
              border: 'rgba(255, 255, 255, 0.08)',
              borderHover: 'rgba(255, 255, 255, 0.15)',
              subtle: 'rgba(255, 255, 255, 0.04)',
            }
          },
          fontFamily: {
            sans: [
              '-apple-system',
              'BlinkMacSystemFont',
              '"SF Pro Text"',
              '"SF Pro Display"',
              'Helvetica Neue',
              'Arial',
              'sans-serif'
            ]
          },
          backdropBlur: {
            'glass': '24px',
            'glass-thick': '36px'
          }
        }
      }

<!-- Typography & Global Behavior Styles -->
<style data-purpose="typography">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    input::placeholder {
      color: rgba(142, 142, 147, 0.7);
    }
  </style>
<!-- Liquid Glass Effects & Custom Components -->
<style data-purpose="liquid-glass-effects">
    .liquid-glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.02) 100%), rgba(26, 26, 30, 0.6);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
    }
    .liquid-glass-panel {
      background: rgba(22, 22, 26, 0.72);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 40px -8px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
    }
    .liquid-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.07) 15%, rgba(255, 255, 255, 0.07) 85%, rgba(255, 255, 255, 0.02) 100%);
    }
    /* Smooth toggle animation */
    .toggle-checkbox:checked {
      right: 2px;
      left: auto;
      background-color: #ffffff;
    }
    .toggle-checkbox:checked + .toggle-track {
      background-color: #0066cc;
    }
  </style>
</head>
<body class="bg-black text-[#F2F2F7] antialiased min-h-screen flex justify-center selection:bg-brand-blue selection:text-white">

<svg class="w-5 h-5 stroke-current stroke-[2.2]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">

<line x1="6" x2="18" y1="6" y2="18"></line>

</button>

<!-- END: TopBar -->

</svg>
</button>

</div>

<span class="block text-[19px] text-[#F2F2F7] font-medium leading-none tracking-tight">12:30</span>
</button>
<!-- Directional Connecting Arrow / Chevron -->
<div class="text-[#8E8E93]/40 px-2">
<svg class="w-4 h-4 stroke-current stroke-[2.2]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</div>
<!-- End Date & Time -->
<button class="text-left group transition-all py-1 px-2 rounded-lg hover:bg-white/[0.04]" type="button">
<span class="block text-[13px] text-[#8E8E93] font-normal leading-none mb-1">gio 1 ott</span>
<span class="block text-[19px] text-[#F2F2F7] font-medium leading-none tracking-tight">13:30</span>

<path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
</svg>
</div>
<span class="text-[16px] text-[#F2F2F7]">Promemoria</span>
</div>

<button class="flex items-center gap-1 text-[15px] text-[#8E8E93] hover:text-white transition" type="button">
<span>Aggiungi</span>
<svg class="w-3.5 h-3.5 stroke-current stroke-[2.5]" fill="none" viewBox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</button>
</div>

<div class="flex items-center gap-2">

</div>

<label class="relative inline-flex items-center cursor-pointer">

<button class="w-full px-4 py-3.5 flex items-center justify-between hover:bg-white/[0.02] transition text-left" type="button">
<div class="flex items-center gap-3">

</div>

<div class="flex items-center gap-2">
