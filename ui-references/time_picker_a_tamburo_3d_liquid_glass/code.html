<style data-purpose="layout-and-glass-effects">
    /* iOS Wheel Cylinder 3D Transformations */
    .perspective-container {
      perspective: 800px;
      perspective-origin: 50% 50%;
      transform-style: preserve-3d;
    }
    
    /* Drum curvature emulation - crisp, absolutely NO blur */
    .wheel-item {
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease;
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* 3D Cylindrical Drum Steps: distinct angles, clean scaling, razor-sharp rendering */
    .wheel-prev-2 {
      transform: translateY(2px) rotateX(46deg) translateZ(-34px) scale(0.76);
      opacity: 0.32;
      color: #8e8e93;
    }
    .wheel-prev-1 {
      transform: translateY(1px) rotateX(24deg) translateZ(-12px) scale(0.90);
      opacity: 0.68;
      color: #c7c7cc;
    }
    .wheel-selected {
      transform: rotateX(0deg) translateZ(12px) scale(1.08);
      opacity: 1;
      font-weight: 700;
      color: #ffffff;
    }
    .wheel-next-1 {
      transform: translateY(-1px) rotateX(-24deg) translateZ(-12px) scale(0.90);

    .wheel-next-2 {

    /* Soft cylinder illumination and edge fade mask */

<!-- Micro-interaction script to simulate tactile drum touch rolling -->
<script data-purpose="drum-roller-interaction">
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.querySelector('[data-purpose="time-picker-dialog-card"]');
      
      // Subtle tactile hover/touch tilt feedback for liquid glass realism
      if (modal) {
        modal.addEventListener('mousemove', (e) => {
          const rect = modal.getBoundingClientRect();
          const x = e.clientX - rect.left - rect.width / 2;
          const y = e.clientY - rect.top - rect.height / 2;
          const tiltX = (y / rect.height) * -3;
          const tiltY = (x / rect.width) * 3;
          modal.style.transform = `perspective(800px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
        });

        modal.addEventListener('mouseleave', () => {
          modal.style.transform = 'perspective(800px) rotateX(0deg) rotateY(0deg)';
        });
      }
    });
  </script>
